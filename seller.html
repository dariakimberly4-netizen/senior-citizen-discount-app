<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Seller Portal</title><style>:root{--g:#174d3b;--c:#fbf7ee;--m:#68746e}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#e9efe9}.app{max-width:540px;margin:auto;min-height:100vh;background:var(--c)}header{background:var(--g);color:#fff;padding:20px}main{padding:16px}.card{background:#fff;border:1px solid #eadfc8;border-radius:20px;padding:17px;margin-bottom:14px}.step{font-size:12px;font-weight:900;color:var(--g);text-transform:uppercase}.small{font-size:14px;color:var(--m)}.input{width:100%;padding:15px;border:1px solid #d7d0c2;border-radius:14px;font-size:18px;margin-top:10px}.btn{width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:900;background:var(--g);color:#fff;margin-top:12px}.btn.alt{background:#fff;color:var(--g);border:2px solid var(--g)}.verified,.result{display:none;padding:14px;margin-top:12px;border-radius:16px}.verified{background:#edf6f1}.result{background:#fff7df}.show{display:block}.back{display:block;text-align:center;color:var(--g);font-weight:800;padding:18px;text-decoration:none}</style></head><body><div class="app"><header><div style="font-size:12px;font-weight:800">ESTABLISHMENT ACCESS</div><h1>Seller Portal</h1><div>Digital Senior Citizen Booklet</div></header><main><div class="card" id="login"><div class="step">Seller Login</div><h2>Establishment / Cashier</h2><input class="input" id="seller" placeholder="Establishment name"><button class="btn" onclick="enterPortal()">Enter Seller Portal</button></div><div id="portal" style="display:none"><div class="card"><div class="step">Step 1</div><h2>Scan or Enter Senior ID</h2><input class="input" id="sid" placeholder="Senior Citizen ID"><button class="btn" onclick="verify()">Verify Senior</button><div class="verified" id="verified"><strong>ACTIVE SENIOR</strong><div class="small">Demo verified account</div></div></div><div class="card"><div class="step">Step 2</div><h2>Enter Purchase</h2><select class="input" id="type"><option>Food / Restaurant</option><option>Medicine</option><option>Grocery / Basic Necessity</option><option>Other Eligible Purchase</option></select><input class="input" id="amount" inputmode="decimal" placeholder="Purchase amount"><input class="input" id="receipt" placeholder="Receipt / Invoice No."><button class="btn" onclick="calc()">Apply Discount</button><div class="result" id="result"></div></div><div class="card"><div class="step">Step 3</div><h2>Confirm Transaction</h2><div class="small">Review details before saving.</div><button class="btn" onclick="confirmTx()">Confirm & Save</button><button class="btn alt" onclick="resetTx()">Start New Transaction</button></div></div><a class="back" href="index.html">← Back to Senior Citizen Booklet</a></main></div><script>let ok=false;function enterPortal(){document.getElementById('login').style.display='none';document.getElementById('portal').style.display='block'}function verify(){if(!document.getElementById('sid').value.trim()){alert('Enter or scan the Senior Citizen ID.');return}ok=true;document.getElementById('verified').classList.add('show')}function calc(){if(!ok){alert('Verify the senior citizen first.');return}let a=parseFloat((document.getElementById('amount').value||'0').replace(/[^\d.]/g,''));if(!a){alert('Enter the purchase amount.');return}let t=document.getElementById('type').value,d=t==='Grocery / Basic Necessity'?a*.10:a*.20,p=a-d,r=document.getElementById('result');r.innerHTML='<strong>Estimated discount: ₱'+d.toFixed(2)+'</strong><br><span class="small">Estimated amount to pay: ₱'+p.toFixed(2)+'</span>';r.classList.add('show')}function confirmTx(){if(!ok){alert('Verify the senior citizen first.');return}alert('Demo transaction saved.')}function resetTx(){ok=false;['sid','amount','receipt'].forEach(id=>document.getElementById(id).value='');document.getElementById('verified').classList.remove('show');document.getElementById('result').classList.remove('show')}</script></body></html>
