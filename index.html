<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#12385a"><title>Digital Senior Citizen Booklet</title><style>
:root{--navy:#103458;--gold:#cba352;--white:#fff;--cream:#fcfaf6;--text:#102f4d;--soft:#f7efe0}*{box-sizing:border-box}body{margin:0;background:#e9edf3;color:var(--text);font-family:Georgia,'Times New Roman',serif}.app{max-width:620px;min-height:100vh;margin:auto;background:var(--white)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:4px}header{background:var(--navy);color:white;text-align:center;padding:32px 18px 49px;position:relative;border-bottom:6px solid var(--gold);border-radius:0 0 48% 8% / 0 0 6% 3%}header .tiny{font:400 17px Arial,sans-serif;letter-spacing:.42em;margin:0 0 5px}header h1{font-size:clamp(25px,6vw,38px);line-height:1.13;margin:7px auto 14px;max-width:560px}header .rule{height:2px;background:var(--gold);width:60px;margin:0 auto 16px}header p{font:12px/1.6 Arial,sans-serif;letter-spacing:.19em;text-transform:uppercase;margin:0}.wrap{padding:24px 17px 42px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.tile{position:relative;border:1.6px solid var(--gold);border-radius:21px;background:white;color:var(--navy);min-height:204px;padding:24px 7px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:background .15s,transform .15s}.tile:active{transform:scale(.98)}.icon{width:103px;height:103px;border-radius:50%;background:var(--soft);display:grid;place-items:center}.icon svg{width:57px;height:57px;stroke:var(--navy);stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round}.tile strong{font-size:clamp(14px,3.6vw,22px);line-height:1.23;letter-spacing:-.02em;text-align:center}.arrow{position:absolute;right:11px;top:50%;transform:translateY(-50%);border-radius:50%;width:29px;height:29px;background:var(--gold);color:white;display:grid;place-items:center;font:900 22px Arial,sans-serif}.footer{text-align:center;margin:28px auto 0;color:#607085;font:12px/1.6 Arial,sans-serif}.footer a{color:var(--navy)}.panel{display:none;position:fixed;inset:0;z-index:3;overflow:auto;max-width:620px;margin:auto;background:var(--cream)}.panel.active{display:block}.panelbar{background:var(--navy);color:white;padding:17px;display:flex;align-items:center;gap:16px;position:sticky;top:0}.panelbar b{font-size:21px}.back{padding:12px 15px;border:1px solid #ffffff88;background:white;color:var(--navy);border-radius:11px;font:800 16px Arial,sans-serif}.inside{padding:20px 17px 40px}.box{background:white;border:1px solid #e5d8be;border-radius:18px;padding:19px;margin-bottom:13px;box-shadow:0 3px 12px #0f304b0b}.box h3{margin:0 0 9px;font-size:20px}.box p{font:15px/1.55 Arial,sans-serif;margin:6px 0;color:#42546c}.linkbtn{display:block;width:100%;text-align:left;border:1px solid #e7d5b4;border-radius:14px;background:#fff;color:var(--navy);font:700 18px Arial,sans-serif;padding:18px;margin:11px 0}.linkbtn .chev{float:right;color:var(--gold)}.notice{padding:13px 15px;border-radius:12px;background:#fff5e2;border:1px solid #e6d1a1;font:14px/1.55 Arial,sans-serif;margin-bottom:15px}.id{border:2px solid var(--gold);border-radius:18px;background:#fff;padding:23px;text-align:center}.id h3{margin:6px 0;font-size:24px}.id .fakeqr{background:repeating-conic-gradient(#18385a 0% 25%,white 0% 50%) 50%/18px 18px;border:12px solid #fff;width:142px;height:142px;margin:18px auto}.badge{font:800 12px Arial,sans-serif;display:inline-block;color:#63460f;background:#fff2ce;padding:7px 12px;border-radius:20px}.savings{font:900 34px Arial,sans-serif;color:var(--navy);margin:8px 0}.meta{font:14px/1.6 Arial,sans-serif;color:#56657a}.btn{background:var(--navy);color:white;border:0;border-radius:12px;padding:16px;width:100%;font:800 17px Arial,sans-serif;margin:12px 0}.label{display:block;font:700 15px Arial,sans-serif;margin-top:12px}.field{width:100%;margin-top:7px;border:1px solid #b8c3d0;border-radius:12px;font:16px Arial,sans-serif;padding:14px}.tx{display:flex;justify-content:space-between;gap:10px}.tx b{font:800 17px Arial,sans-serif}.tx .val{font:800 17px Arial,sans-serif;text-align:right}.empty{font:15px Arial,sans-serif;color:#617188;padding:20px}a{color:var(--navy)}@media(max-width:390px){.tile{min-height:165px;padding:15px 5px}.icon{width:78px;height:78px}.icon svg{width:46px;height:46px}.grid{gap:10px}.arrow{right:7px;width:23px;height:23px;font-size:17px}header{padding:27px 13px 38px}}
</style></head><body><div class="app"><header><div class="tiny">DIGITAL</div><h1>SENIOR CITIZEN BOOKLET</h1><div class="rule"></div><p>Your Benefits. Your Purchases.<br>Your Digital Booklet.</p></header><main class="wrap"><div class="grid">
<button class="tile" onclick="openPage('digital')"><span class="icon"><svg viewBox="0 0 64 64"><rect x="7" y="14" width="50" height="36" rx="5"/><circle cx="23" cy="29" r="6"/><path d="M14 42c2-8 16-8 18 0M39 27h11M39 35h11"/></svg></span><strong>MY<br>DIGITAL ID</strong><span class="arrow">›</span></button>
<button class="tile" onclick="openPage('booklets')"><span class="icon"><svg viewBox="0 0 64 64"><path d="M32 52c-7-5-15-7-25-6V13c11-2 20 1 25 6 5-5 14-8 25-6v33c-10-1-18 1-25 6ZM32 19v33"/></svg></span><strong>MY<br>BOOKLETS</strong><span class="arrow">›</span></button>
<button class="tile" onclick="openPage('transactions')"><span class="icon"><svg viewBox="0 0 64 64"><path d="M16 7h25l9 9v41H16zM41 7v12h9M24 29h18M24 38h18M24 47h14"/></svg></span><strong>MY<br>TRANSACTIONS</strong><span class="arrow">›</span></button>
<button class="tile" onclick="openPage('benefits')"><span class="icon"><svg viewBox="0 0 64 64"><rect x="8" y="26" width="48" height="30" rx="3"/><path d="M6 20h52v11H6zM32 20v36M30 20C12 20 16 5 25 9c7 4 7 11 7 11ZM34 20c18 0 14-15 5-11-7 4-7 11-7 11Z"/></svg></span><strong>MY<br>BENEFITS</strong><span class="arrow">›</span></button>
<button class="tile" onclick="openPage('account')"><span class="icon"><svg viewBox="0 0 64 64"><circle cx="32" cy="21" r="11"/><path d="M11 55c0-16 10-23 21-23s21 7 21 23"/></svg></span><strong>MY<br>ACCOUNT</strong><span class="arrow">›</span></button>
<button class="tile" onclick="openPage('help')"><span class="icon"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="24"/><path d="M24 24c1-13 20-12 20 0 0 9-12 8-12 17M32 49v1"/></svg></span><strong>HELP &amp;<br>SUPPORT</strong><span class="arrow">›</span></button>
</div><div class="footer">NAVY & GOLD EDITION · INTERACTIVE DEMO<br>No official ID, QR verification, seller synchronization, or OSCA approval is connected.<br><a href="seller.html">Separate Seller Portal</a></div></main></div>
<section class="panel" id="screen"><div class="panelbar"><button class="back" onclick="goBack()">← Back</button><b id="screenTitle">My Booklet</b></div><div class="inside" id="screenContent"></div></section>
<script>
const demo=[{kind:'Medicine',store:'Sample Pharmacy',date:'Oct 6, 2026',amount:680,discount:136,ref:'DEMO-001'},{kind:'Food',store:'Sample Restaurant',date:'Oct 4, 2026',amount:420,discount:84,ref:'DEMO-002'},{kind:'Grocery',store:'Sample Grocery',date:'Oct 2, 2026',amount:350,discount:17.5,ref:'DEMO-003'}];const names={digital:'My Digital ID',booklets:'My Booklets',medicine:'Medicine Booklet',grocery:'Grocery Booklet',food:'Food & Restaurants',transactions:'My Transactions',receipts:'Digital Receipts',savings:'My Savings',benefits:'My Benefits',account:'My Account',profile:'My Profile',representative:'Authorized Representative',notifications:'Notifications',security:'Security Settings',help:'Help & Support',report:'Report a Problem'};let stack=[];const money=n=>'₱'+n.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});function option(id,title,sub=''){return `<button class="linkbtn" onclick="openPage('${id}')">${title}<span class="chev">›</span>${sub?`<p class="meta">${sub}</p>`:''}</button>`}function records(items){return items.length?items.map(t=>`<div class="box"><div class="tx"><div><b>${t.store}</b><div class="meta">${t.kind} · ${t.date}</div><div class="meta">Receipt: ${t.ref}</div></div><div class="val">${money(t.amount)}<div class="meta">Saved ${money(t.discount)}</div></div></div></div>`).join(''):'<div class="empty">No sample transactions.</div>'}function view(id){switch(id){case'digital':return `<div class="id"><div class="badge">DEMO — NOT OFFICIAL</div><h3>Sample Senior Citizen</h3><div class="meta">ID: DEMO-SC-001 · Bacoor City</div><div class="fakeqr" aria-label="Decorative non-scannable QR placeholder"></div><div class="meta">QR illustration only — not scannable</div><p class="meta">OSCA Head approval and signature: NOT ISSUED</p></div><div class="notice">A genuine authorized OSCA approval, secure ID, and scannable QR require a protected backend.</div>`;case'booklets':return option('medicine','💊 Medicine Booklet','Pharmacy purchases')+option('grocery','🛒 Grocery Booklet','Basic necessities')+option('food','🍽 Food & Restaurant Booklet','Qualified meals');case'medicine':case'grocery':case'food':return `<div class="notice">Sample records only; not an official purchase ledger.</div>${records(demo.filter(x=>x.kind===(id==='medicine'?'Medicine':id==='grocery'?'Grocery':'Food')))}`;case'transactions':return option('receipts','Digital Receipts')+option('savings','My Savings')+`<div class="box"><h3>Purchase History</h3><label class="label">Category</label><select class="field" id="filter" onchange="filterTx()"><option value="all">All</option><option>Medicine</option><option>Grocery</option><option>Food</option></select></div><div id="filtered">${records(demo)}</div>`;case'receipts':return `<div class="notice">Sample receipt references only. No actual receipt files are stored.</div>${records(demo)}`;case'savings':return `<div class="box"><h3>Total Sample Savings</h3><div class="savings">${money(demo.reduce((n,t)=>n+t.discount,0))}</div><p>Based on fictional records only.</p></div>`+['Medicine','Grocery','Food'].map(kind=>`<div class="box"><h3>${kind}</h3><div class="savings">${money(demo.filter(t=>t.kind===kind).reduce((n,t)=>n+t.discount,0))}</div></div>`).join('');case'benefits':return `<div class="box"><h3>💊 Medicines</h3><p>Present a prescription when required and appropriate identification.</p></div><div class="box"><h3>🛒 Groceries</h3><p>Qualifying necessities and prime commodities are subject to applicable rules and limits.</p></div><div class="box"><h3>🍽 Food</h3><p>Benefits apply to qualifying purchases for the senior's own consumption.</p></div><div class="box"><h3>Other Benefits</h3><p>Transport and medical services may qualify under applicable rules.</p></div><div class="notice">Actual eligibility and discount computation must follow current Philippine law.</div>`;case'account':return option('profile','My Profile')+option('representative','Authorized Representative')+option('notifications','Notifications')+option('security','Security & Settings');case'profile':return `<div class="box"><h3>Sample Senior Citizen</h3><p>Demo ID: DEMO-SC-001</p><p>City: Bacoor</p><p>Status: NOT VERIFIED</p></div><div class="box"><h3>Emergency Contact</h3><p>Not registered.</p></div>`;case'representative':return `<div class="box"><h3>Representative</h3><p>None registered in this demo.</p></div><div class="notice">Official authorization must be reviewed by OSCA personnel. Do not enter personal IDs in this demo.</div>`;case'notifications':return `<div class="box"><h3>Sample Notifications</h3><p>Medicine purchase recorded (demo).</p><p>Grocery purchase recorded (demo).</p></div>`;case'security':return `<div class="box"><h3>Security</h3><p>PIN, biometric authentication and secure logout require a connected identity service.</p></div><button class="btn" onclick="alert('Demo only: no authentication session exists to lock.')">Lock Booklet (Demo)</button>`;case'help':return option('report','Report a Problem')+`<div class="box"><h3>QR Problems</h3><p>Use a valid physical ID for manual verification where accepted.</p></div><div class="box"><h3>Lost Phone</h3><p>Contact OSCA to secure official access.</p></div>`;case'report':return `<div class="box"><h3>Report an Incorrect Transaction</h3><label class="label">Sample record</label><select class="field" id="reportRecord">${demo.map(t=>`<option>${t.ref}</option>`).join('')}</select><label class="label">Concern</label><select class="field" id="reportReason"><option>Incorrect amount</option><option>Unrecognized purchase</option><option>Wrong category</option></select><button class="btn" onclick="alert('Demo only: no report was sent to OSCA.')">Preview Report</button></div>`;default:return '<div class="empty">Section unavailable.</div>'}}function openPage(id){stack.push(id);draw()}function goBack(){stack.pop();draw()}function draw(){let s=document.getElementById('screen');if(!stack.length){s.classList.remove('active');return}let id=stack[stack.length-1];document.getElementById('screenTitle').textContent=names[id];document.getElementById('screenContent').innerHTML=view(id);s.classList.add('active');s.scrollTop=0}function filterTx(){let value=document.getElementById('filter').value;document.getElementById('filtered').innerHTML=records(demo.filter(t=>value==='all'||t.kind===value))}
</script></body></html>
